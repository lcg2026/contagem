<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Contador de Cápsulas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --accent: #22c55e;
    --accent-2: #38bdf8;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header {
    padding: 10px 14px;
    text-align: center;
    font-weight: 600;
    font-size: 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-2);
    flex: none;
  }

  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #photo, #overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%; max-height: 100%;
  }
  #photo { object-fit: contain; display: none; }
  #overlay { pointer-events: none; }

  #placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 30px;
    color: var(--text-dim); font-size: 14px;
  }
  #placeholder.hidden { display: none; }

  #countBadge {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.85);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 6px 22px;
    text-align: center;
    min-width: 120px;
  }
  #countNumber { font-size: 42px; font-weight: 700; line-height: 1; }
  #countLabel { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  #matchBadge {
    position: absolute;
    top: 12px; right: 12px;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  #matchBadge.ok { display: block; background: rgba(34,197,94,0.9); color: #052e16; }
  #matchBadge.bad { display: block; background: rgba(239,68,68,0.9); color: #450a0a; }

  #hint {
    position: absolute;
    bottom: 10px; left: 50%;
    transform: translateX(-50%);
    background: rgba(15,23,42,0.85);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    max-width: 90%;
  }

  #toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 85%;
    background: rgba(15,23,42,0.97);
    border: 2px solid var(--accent-2);
    border-radius: 14px;
    padding: 16px 20px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    z-index: 20;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #toast.show { display: block; }
  #toast.ok { border-color: var(--accent); }
  #toast.err { border-color: var(--danger); }

  #nameModal {
    position: absolute; inset: 0; z-index: 25;
    background: rgba(15,23,42,0.92);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  #nameModal.show { display: flex; }
  #nameModal .box {
    background: var(--panel); border-radius: 14px; padding: 18px;
    width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px;
  }
  #nameModal input {
    background: var(--panel-2); border: none; color: var(--text);
    border-radius: 8px; padding: 10px; font-size: 14px;
  }
  #nameModal .box-buttons { display: flex; gap: 8px; }
  #nameModal .box-buttons button {
    flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer;
  }
  #nameModal .btn-confirm { background: var(--accent); color: #052e16; font-weight: 600; }
  #nameModal .btn-cancel { background: var(--panel-2); color: var(--text); }

  #controls {
    flex: none;
    background: var(--panel);
    border-top: 1px solid var(--panel-2);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { font-size: 12px; color: var(--text-dim); width: 100px; flex: none; }
  .row input[type=range] { flex: 1; accent-color: var(--accent-2); }
  .row input[type=number] {
    width: 70px; background: var(--panel-2); border: none; color: var(--text);
    border-radius: 8px; padding: 6px 8px; font-size: 14px;
  }
  .row select {
    flex: 1; background: var(--panel-2); border: none; color: var(--text);
    border-radius: 8px; padding: 8px; font-size: 13px;
  }
  #calibStatus { flex: 1; font-size: 12px; color: var(--text-dim); }
  #btnCalibrate, #btnSavePreset {
    padding: 8px 14px; border-radius: 8px; border: none;
    background: var(--panel-2); color: var(--text); font-size: 12px; cursor: pointer; flex: none;
  }
  #btnCalibrate.set { background: var(--accent-2); color: #082f49; }
  #btnSavePreset:disabled { opacity: 0.4; }
  .switch-row { display: flex; gap: 8px; }
  .switch-row button {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--panel-2);
    background: var(--panel-2); color: var(--text-dim); font-size: 12px; cursor: pointer;
  }
  .switch-row button.active { background: var(--accent-2); color: #082f49; border-color: var(--accent-2); font-weight: 600; }

  #mainButtons { display: flex; gap: 10px; }
  #mainButtons button {
    flex: 1; padding: 14px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #btnCapture { background: var(--accent); color: #052e16; }

  #advToggle {
    text-align: center; font-size: 12px; color: var(--text-dim);
    cursor: pointer; padding: 2px;
  }
  #advPanel { display: none; flex-direction: column; gap: 10px; }
  #advPanel.open { display: flex; }

  #loading {
    position: absolute; inset: 0; background: rgba(15,23,42,0.95);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; font-size: 14px; color: var(--text-dim);
    z-index: 10;
  }
  #loading.hidden { display: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--panel-2); border-top-color: var(--accent-2);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <header>Contador de Cápsulas</header>

  <div id="stage">
    <div id="loading"><div class="spinner"></div><div>Carregando motor de visão...</div></div>
    <div id="placeholder">Toque em "Tirar foto" para fotografar a bandeja</div>
    <img id="photo" alt="">
    <canvas id="overlay"></canvas>
    <div id="countBadge">
      <div id="countNumber">--</div>
      <div id="countLabel">cápsulas</div>
    </div>
    <div id="matchBadge"></div>
    <div id="hint">Espalhe as cápsulas na bandeja sem encostar umas nas outras, sobre fundo liso e contrastante.</div>
    <div id="toast"></div>
    <div id="nameModal">
      <div class="box">
        <label style="font-size:13px;color:var(--text-dim);">Nome da predefinição</label>
        <input type="text" id="nameInput" placeholder='ex: "Cápsula 0 - Vitamina D"'>
        <div class="box-buttons">
          <button class="btn-cancel" id="nameCancel">Cancelar</button>
          <button class="btn-confirm" id="nameConfirm">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="row">
      <label>Qtd. esperada</label>
      <input type="number" id="expected" placeholder="opcional" min="0" inputmode="numeric">
    </div>

    <div class="row">
      <label>Predefinição</label>
      <select id="presetSelect"><option value="">— nenhuma —</option></select>
    </div>

    <div class="row">
      <label>Tam. da cápsula</label>
      <span id="calibStatus">Não calibrado</span>
      <button id="btnCalibrate">Calibrar</button>
    </div>

    <div id="mainButtons">
      <button id="btnCapture">Tirar foto</button>
      <button id="btnSavePreset" disabled>Salvar predefinição</button>
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

    <div id="advToggle">▾ Ajustes avançados</div>
    <div id="advPanel">
      <div class="switch-row">
        <button id="btnLight" class="active">Cápsulas mais claras</button>
        <button id="btnDark">Cápsulas mais escuras</button>
      </div>
      <div class="row">
        <label>Sensibilidade</label>
        <input type="range" id="sensitivity" min="-40" max="40" value="0" step="1">
      </div>
      <div class="row">
        <label>Tamanho mínimo</label>
        <input type="range" id="minSize" min="50" max="2000" value="250" step="10">
      </div>
    </div>
  </div>
</div>

<script src="opencv.js"></script>
<script>
(function () {
  var photo = document.getElementById('photo');
  var placeholder = document.getElementById('placeholder');
  var overlay = document.getElementById('overlay');
  var octx = overlay.getContext('2d');
  var loading = document.getElementById('loading');
  var btnCapture = document.getElementById('btnCapture');
  var btnSavePreset = document.getElementById('btnSavePreset');
  var photoInput = document.getElementById('photoInput');
  var countNumber = document.getElementById('countNumber');
  var matchBadge = document.getElementById('matchBadge');
  var expectedInput = document.getElementById('expected');
  var sensitivity = document.getElementById('sensitivity');
  var minSize = document.getElementById('minSize');
  var btnLight = document.getElementById('btnLight');
  var btnDark = document.getElementById('btnDark');
  var advToggle = document.getElementById('advToggle');
  var advPanel = document.getElementById('advPanel');
  var btnCalibrate = document.getElementById('btnCalibrate');
  var calibStatus = document.getElementById('calibStatus');
  var presetSelect = document.getElementById('presetSelect');
  var toast = document.getElementById('toast');
  var nameModal = document.getElementById('nameModal');
  var nameInput = document.getElementById('nameInput');
  var nameCancel = document.getElementById('nameCancel');
  var nameConfirm = document.getElementById('nameConfirm');

  var cvReady = false;
  var unitArea = null;
  var invertThreshold = false;
  var hasPhoto = false;
  var captureMode = 'count';
  var processCanvas = document.createElement('canvas');
  var pctx = processCanvas.getContext('2d', { willReadFrequently: true });
  var PROC_WIDTH = 480;
  var toastTimer = null;

  // Substitui alert()/prompt(): em apps adicionados à tela de início do iPhone (modo standalone),
  // diálogos nativos do navegador podem não funcionar — esses avisos ficam dentro da própria página.
  function showToast(message, type, durationMs) {
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.className = 'show' + (type ? ' ' + type : '');
    if (durationMs !== 0) {
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, durationMs || 2600);
    }
  }

  function askName(callback) {
    nameInput.value = '';
    nameModal.classList.add('show');
    nameInput.focus();
    function cleanup() {
      nameModal.classList.remove('show');
      nameConfirm.removeEventListener('click', onConfirm);
      nameCancel.removeEventListener('click', onCancel);
    }
    function onConfirm() {
      var v = nameInput.value.trim();
      cleanup();
      if (v) callback(v);
    }
    function onCancel() { cleanup(); }
    nameConfirm.addEventListener('click', onConfirm);
    nameCancel.addEventListener('click', onCancel);
  }

  advToggle.addEventListener('click', function () {
    advPanel.classList.toggle('open');
    advToggle.textContent = advPanel.classList.contains('open') ? '▴ Ajustes avançados' : '▾ Ajustes avançados';
  });

  btnLight.addEventListener('click', function () {
    invertThreshold = false;
    btnLight.classList.add('active');
    btnDark.classList.remove('active');
    analyzeCurrentPhoto();
  });
  btnDark.addEventListener('click', function () {
    invertThreshold = true;
    btnDark.classList.add('active');
    btnLight.classList.remove('active');
    analyzeCurrentPhoto();
  });
  [sensitivity, minSize].forEach(function (el) {
    el.addEventListener('input', analyzeCurrentPhoto);
  });

  function computeMask(src, gray, blurred, thresh, kernel, opened, closed) {
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
    var otsu = cv.threshold(blurred, thresh, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
    var offset = parseInt(sensitivity.value, 10);
    var mode = invertThreshold ? cv.THRESH_BINARY_INV : cv.THRESH_BINARY;
    cv.threshold(blurred, thresh, otsu - offset, 255, mode);
    cv.morphologyEx(thresh, opened, cv.MORPH_OPEN, kernel);
    cv.morphologyEx(opened, closed, cv.MORPH_CLOSE, kernel);
  }

  // --- Predefinições (banco local de calibrações por cápsula/lote) ---
  function loadPresets() {
    try {
      var v = localStorage.getItem('capsulePresets');
      return v ? JSON.parse(v) : {};
    } catch (e) { return {}; }
  }

  function savePresets(presets) {
    try { localStorage.setItem('capsulePresets', JSON.stringify(presets)); } catch (e) {}
  }

  function refreshPresetSelect(selectName) {
    var presets = loadPresets();
    presetSelect.innerHTML = '<option value="">— nenhuma —</option>';
    Object.keys(presets).sort().forEach(function (name) {
      var opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name + ' (' + Math.round(presets[name]) + ' px²)';
      presetSelect.appendChild(opt);
    });
    if (selectName) presetSelect.value = selectName;
  }

  presetSelect.addEventListener('change', function () {
    var presets = loadPresets();
    var name = presetSelect.value;
    if (!name || !presets[name]) return;
    unitArea = presets[name];
    updateCalibLabel();
    analyzeCurrentPhoto();
  });

  btnSavePreset.addEventListener('click', function () {
    if (!unitArea) { showToast('Calibre primeiro tocando numa cápsula.', 'err'); return; }
    askName(function (name) {
      var presets = loadPresets();
      presets[name] = unitArea;
      savePresets(presets);
      refreshPresetSelect(name);
      showToast('Predefinição "' + name + '" salva.', 'ok');
    });
  });

  // --- Calibração: foto separada de 1 cápsula sozinha (sem precisar tocar em nada) ---
  function updateCalibLabel() {
    if (unitArea) {
      calibStatus.textContent = 'Calibrado (' + Math.round(unitArea) + ' px²)';
      btnCalibrate.classList.add('set');
      btnCalibrate.textContent = 'Recalibrar';
      btnSavePreset.disabled = false;
    } else {
      calibStatus.textContent = 'Não calibrado';
      btnCalibrate.classList.remove('set');
      btnCalibrate.textContent = 'Calibrar';
      btnSavePreset.disabled = true;
    }
  }

  function processCalibrationPhoto(imgEl) {
    var vscale = PROC_WIDTH / imgEl.naturalWidth;
    var pw = PROC_WIDTH, ph = Math.round(imgEl.naturalHeight * vscale);
    var cCanvas = document.createElement('canvas');
    cCanvas.width = pw; cCanvas.height = ph;
    cCanvas.getContext('2d').drawImage(imgEl, 0, 0, pw, ph);

    var src = cv.imread(cCanvas);
    var gray = new cv.Mat(), blurred = new cv.Mat(), thresh = new cv.Mat();
    var kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(3, 3));
    var opened = new cv.Mat(), closed = new cv.Mat();
    var contours = new cv.MatVector(), hierarchy = new cv.Mat();
    try {
      computeMask(src, gray, blurred, thresh, kernel, opened, closed);
      cv.findContours(closed, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      var best = 0;
      for (var i = 0; i < contours.size(); i++) {
        var cnt = contours.get(i);
        var a = cv.contourArea(cnt);
        if (a > best) best = a;
        cnt.delete();
      }
      if (best < 50) {
        showToast('Não encontrei nenhuma cápsula nessa foto. Tire a foto com 1 cápsula bem visível e sozinha na bandeja.', 'err');
        return;
      }
      unitArea = best;
      updateCalibLabel();
      analyzeCurrentPhoto();
      showToast('Calibrado! Referência: ' + Math.round(best) + ' px².', 'ok');
    } finally {
      src.delete(); gray.delete(); blurred.delete(); thresh.delete();
      kernel.delete(); opened.delete(); closed.delete();
      contours.delete(); hierarchy.delete();
    }
  }

  btnCalibrate.addEventListener('click', function () {
    if (!cvReady) { showToast('Aguarde o motor de visão carregar.', 'err'); return; }
    showToast('Coloque 1 cápsula sozinha na bandeja e tire a foto (na mesma distância que vai usar pra contar).', null, 3500);
    captureMode = 'calibrate';
    photoInput.value = '';
    photoInput.click();
  });

  // --- Captura de foto (câmera nativa do celular, sem vídeo ao vivo) ---
  btnCapture.addEventListener('click', function () {
    if (!cvReady) { showToast('Aguarde o motor de visão carregar.', 'err'); return; }
    captureMode = 'count';
    photoInput.value = '';
    photoInput.click();
  });

  photoInput.addEventListener('change', function () {
    var file = photoInput.files && photoInput.files[0];
    if (!file) return;
    var url = URL.createObjectURL(file);
    var mode = captureMode;

    if (mode === 'calibrate') {
      var tmpImg = new Image();
      tmpImg.onload = function () {
        URL.revokeObjectURL(url);
        processCalibrationPhoto(tmpImg);
      };
      tmpImg.src = url;
      return;
    }

    photo.onload = function () {
      URL.revokeObjectURL(url);
      hasPhoto = true;
      placeholder.classList.add('hidden');
      photo.style.display = 'block';
      resizeCanvases();
      analyzeCurrentPhoto();
    };
    photo.src = url;
  });

  function resizeCanvases() {
    var w = photo.naturalWidth, h = photo.naturalHeight;
    if (!w || !h) return;
    var rect = photo.getBoundingClientRect();
    overlay.width = w;
    overlay.height = h;
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
  }
  window.addEventListener('resize', resizeCanvases);

  function updateMatchBadge(count) {
    var expected = parseInt(expectedInput.value, 10);
    if (!expected || isNaN(expected)) {
      matchBadge.className = '';
      matchBadge.textContent = '';
      return;
    }
    if (count === expected) {
      matchBadge.className = 'ok';
      matchBadge.textContent = 'Confere (' + expected + ')';
    } else {
      matchBadge.className = 'bad';
      matchBadge.textContent = (count > expected ? '+' : '') + (count - expected) + ' de ' + expected;
    }
  }
  expectedInput.addEventListener('input', function () {
    if (hasPhoto) updateMatchBadge(parseInt(countNumber.textContent, 10) || 0);
  });

  function analyzeCurrentPhoto() {
    if (!cvReady || !hasPhoto || !photo.naturalWidth) return;

    var scale = PROC_WIDTH / photo.naturalWidth;
    var pw = PROC_WIDTH;
    var ph = Math.round(photo.naturalHeight * scale);
    processCanvas.width = pw;
    processCanvas.height = ph;
    pctx.drawImage(photo, 0, 0, pw, ph);

    var src = cv.imread(processCanvas);
    var gray = new cv.Mat();
    var blurred = new cv.Mat();
    var thresh = new cv.Mat();
    var kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(3, 3));
    var opened = new cv.Mat();
    var closed = new cv.Mat();
    var contours = new cv.MatVector();
    var hierarchy = new cv.Mat();

    try {
      computeMask(src, gray, blurred, thresh, kernel, opened, closed);
      cv.findContours(closed, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      var minArea = parseInt(minSize.value, 10);
      octx.clearRect(0, 0, overlay.width, overlay.height);
      var ow = overlay.width, oh = overlay.height;
      var sx = ow / pw, sy = oh / ph;
      octx.lineWidth = 2;
      octx.strokeStyle = '#22c55e';
      octx.font = 'bold 13px sans-serif';
      octx.fillStyle = '#22c55e';

      // Blobs maiores que 1 cápsula (encostadas/sobrepostas) valem mais que 1,
      // estimado pela área calibrada de 1 cápsula, em vez de sempre contar 1 por blob.
      var count = 0;
      for (var i = 0; i < contours.size(); i++) {
        var cnt = contours.get(i);
        var area = cv.contourArea(cnt);
        if (area >= minArea) {
          var sub = unitArea ? Math.max(1, Math.round(area / unitArea)) : 1;
          count += sub;
          var rect = cv.boundingRect(cnt);
          octx.strokeRect(rect.x * sx, rect.y * sy, rect.width * sx, rect.height * sy);
          if (sub > 1) octx.fillText('×' + sub, rect.x * sx + 2, rect.y * sy + 14);
        }
        cnt.delete();
      }

      countNumber.textContent = count;
      updateMatchBadge(count);
    } finally {
      src.delete(); gray.delete(); blurred.delete(); thresh.delete();
      kernel.delete(); opened.delete(); closed.delete();
      contours.delete(); hierarchy.delete();
    }
  }

  function onOpenCvReady() {
    cvReady = true;
    loading.classList.add('hidden');
  }
  if (typeof cv !== 'undefined' && cv.onRuntimeInitialized !== undefined) {
    cv.onRuntimeInitialized = onOpenCvReady;
  } else {
    var waitCv = setInterval(function () {
      if (typeof cv !== 'undefined') {
        cv.onRuntimeInitialized = onOpenCvReady;
        clearInterval(waitCv);
      }
    }, 100);
  }

  refreshPresetSelect();
  updateCalibLabel();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
